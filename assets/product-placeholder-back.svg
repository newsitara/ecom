<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <!-- Warm Atelier Studio Canvas -->
  <rect width="600" height="800" fill="#F0ECE4" />
  
  <!-- Subtle Studio Frame -->
  <rect x="30" y="30" width="540" height="740" rx="8" fill="none" stroke="#111827" stroke-opacity="0.05" stroke-width="1" />
  
  <!-- Center Garment Frame -->
  <rect x="80" y="130" width="440" height="540" rx="12" fill="#FFFFFF" stroke="#111827" stroke-opacity="0.06" stroke-width="1" />
  
  <!-- Minimalist Apparel Silhouette Back -->
  <g transform="translate(260, 240)" fill="none" stroke="#111827" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 0 L40 12 L60 0 L75 22 L62 28 L62 80 L18 80 L18 28 L5 22 Z" />
    <path d="M40 12 L40 80" stroke-dasharray="4 4" />
  </g>
  
  <!-- Atelier Branding -->
  <text x="300" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#8C827A">NEW SITARA — REVERSE VIEW</text>
  
  <text x="300" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#111827">YOUR PRODUCT HERE</text>
  
  <text x="300" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#8C827A">BACK VIEW • REVERSE DETAIL</text>
  
  <rect x="230" y="450" width="140" height="28" rx="14" fill="#111827" fill-opacity="0.06" />
  <text x="300" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#111827">REPLACE IN ADMIN</text>
  
  <text x="300" y="725" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#8C827A">FW26 COLLECTION • READY-TO-WEAR</text>
</svg>
