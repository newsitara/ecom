<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITARA — Under Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Film Grain Texture for Cinematic Depth -->
  <div class="grain-overlay"></div>

  <!-- Interactive Cinematic Dust & Bokeh Canvas -->
  <canvas id="bokehCanvas"></canvas>

  <!-- Moody Atmospheric Blurred Orbs -->
  <div class="bg-blur-container">
    <div class="blur-orb orb-1" id="orb1"></div>
    <div class="blur-orb orb-2" id="orb2"></div>
    <div class="blur-orb orb-3" id="orb3"></div>
    <div class="bg-vignette"></div>
  </div>

  <div class="page-wrapper">

    <!-- Top Navigation -->
    <header class="header">
      <div class="brand-box">
        <img src="assets/ns%20logo.jpg" alt="NS Logo" class="brand-logo-img">
        <span class="brand-logo">SITARA</span>
      </div>
      <nav class="top-nav">
        <a href="#home" class="nav-item">HOME</a>
      </nav>
    </header>

    <!-- Center Hero Area -->
    <main class="hero-center" id="heroArea">

      <!-- Center Logo Emblem -->
      <div class="center-logo-wrapper">
        <img src="assets/ns%20logo.jpg" alt="Sitara Emblem" class="hero-logo-img">
      </div>

      <!-- Bold Title with Staggered Entrance Animation -->
      <h1 class="main-title">
        <span class="title-line line-1">UNDER</span>
        <span class="title-line line-2">CONSTRUCTION</span>
      </h1>

      <!-- Flanked Subtitle with Growing Lines -->
      <div class="subtitle-wrapper">
        <span class="sub-line left-line"></span>
        <span class="subtitle-text">SITE NEARLY READY</span>
        <span class="sub-line right-line"></span>
      </div>

      <!-- Clean Dynamic Progress Bar with Live % Tracker -->
      <div class="progress-container">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressBar">
            <span class="bar-shine-sweep"></span>
          </div>
        </div>
        <div class="progress-labels">
          <span class="label-start">0%</span>
          <span class="label-current" id="currentPercentText">10%</span>
          <span class="label-end">100%</span>
        </div>
      </div>

      <!-- Interactive Action Area -->
      <div class="action-wrapper">
        <button class="notify-btn" id="notifyBtn" onclick="toggleNotifyModal()">
          <span class="btn-text">Notify Me!</span>
        </button>

        <!-- Slide-out email box -->
        <form class="email-drawer" id="emailDrawer" onsubmit="return handleNotify(event)">
          <div class="drawer-inner">
            <input 
              type="email" 
              id="notifyEmail" 
              placeholder="Enter your email address" 
              required 
              autocomplete="email"
            />
            <button type="submit" class="drawer-submit">
              <span>Submit</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </form>

        <div class="success-banner" id="successBanner">
          <span class="check-icon">✓</span>
          <span>We'll notify you the moment doors open.</span>
        </div>
      </div>

    </main>

    <!-- Bottom Socials & Copyright -->
    <footer class="footer">
      
      <!-- Circular Outlined Social Icons with Hover Micro-Motion -->
      <div class="social-icons">
        <a href="#instagram" class="icon-circle" title="Instagram" onclick="fakeNotice(event, 'Instagram')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>

        <a href="#facebook" class="icon-circle" title="Facebook" onclick="fakeNotice(event, 'Facebook')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
          </svg>
        </a>

        <a href="#pinterest" class="icon-circle" title="Pinterest" onclick="fakeNotice(event, 'Pinterest')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 12a4 4 0 0 1 8 0c0 2.2-1.8 4-4 4"></path>
          </svg>
        </a>

        <a href="#twitter" class="icon-circle" title="Twitter / X" onclick="fakeNotice(event, 'Twitter / X')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
          </svg>
        </a>
      </div>

      <div class="copyright">
        © <span id="year">2026</span> by SITARA. All rights reserved.
      </div>

    </footer>

  </div>

  <!-- Subtle Toast Alert -->
  <div class="clean-toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
