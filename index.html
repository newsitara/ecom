<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITARA — Building Something Special</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Luxury Glow Background -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Interactive Star Particle Canvas -->
  <canvas id="particleCanvas"></canvas>

  <div class="app-container">

    <!-- Header -->
    <header class="top-nav">
      <div class="brand-badge">
        <span class="brand-icon">✦</span>
        <span class="brand-text">SITARA</span>
      </div>
      <div class="live-pill">
        <span class="pulse-ring"></span>
        <span class="live-text">CONSTRUCTION IN PROGRESS</span>
      </div>
    </header>

    <!-- Center Stage: Animated Boutique Loader Experience -->
    <main class="loader-stage">

      <!-- Main Animated Centerpiece -->
      <div class="centerpiece-box" id="centerpiece">
        
        <!-- Rotating Luxury Orbital Rings -->
        <div class="orbital-ring ring-outer"></div>
        <div class="orbital-ring ring-middle"></div>
        
        <!-- Floating Satellite Mini Badges -->
        <div class="satellite-badge sat-1">
          <span>🧵</span> Handcrafting
        </div>
        <div class="satellite-badge sat-2">
          <span>📦</span> Packaging
        </div>
        <div class="satellite-badge sat-3">
          <span>✨</span> New Drops
        </div>

        <!-- Glowing Central Icon (Sitara Star & Bag Motif) -->
        <div class="core-emblem">
          <svg class="emblem-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#E9C46A" />
                <stop offset="100%" stop-color="#D96B43" />
              </linearGradient>
            </defs>
            
            <!-- Pulsing Star Silhouette -->
            <path class="star-shape" d="M50 8 L54 36 L82 40 L58 56 L66 84 L50 68 L34 84 L42 56 L18 40 L46 36 Z" fill="url(#goldGrad)" />
            <circle cx="50" cy="50" r="14" fill="#201B18" />
            <path d="M50 42 L52 48 L58 50 L52 52 L50 58 L48 52 L42 50 L48 48 Z" fill="#FFF" />
          </svg>
        </div>

      </div>

      <!-- Main Loading Headline & Dynamic Status Switcher -->
      <div class="status-content">
        <h1 class="main-title">
          Setting Up Our <span class="highlight-text">Digital Atelier</span>
        </h1>
        
        <!-- Live Changing Text Ticker -->
        <div class="ticker-box">
          <span class="ticker-prefix">Current task:</span>
          <span class="ticker-message" id="tickerMsg">Weaving exclusive silhouettes...</span>
        </div>

        <!-- Animated Progress Meter -->
        <div class="progress-wrapper">
          <div class="progress-meter">
            <div class="progress-indicator" id="progressBar">
              <div class="bar-shine"></div>
            </div>
          </div>
          <div class="progress-meta">
            <span class="loading-label">STORE SETUP</span>
            <span class="loading-percent" id="progressPercent">84%</span>
          </div>
        </div>

        <!-- Interactive Tap Prompt -->
        <div class="tap-hint">
          <span>✨ Click anywhere to sparkle</span>
        </div>

      </div>

    </main>

    <!-- Footer -->
    <footer class="bottom-bar">
      <div class="footer-note">
        © <span id="year">2026</span> SITARA. We will be live shortly.
      </div>
      <div class="social-cluster">
        <a href="#instagram" class="social-tag" onclick="showToast(event, 'Instagram')">Instagram ↗</a>
        <a href="#pinterest" class="social-tag" onclick="showToast(event, 'Pinterest')">Pinterest ↗</a>
        <a href="#tiktok" class="social-tag" onclick="showToast(event, 'TikTok')">TikTok ↗</a>
      </div>
    </footer>

  </div>

  <div class="custom-toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
